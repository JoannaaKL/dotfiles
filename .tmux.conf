# ---------- General ----------
set -g default-shell /bin/zsh
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000
set -g display-time 2000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S / #W"
set -g mouse on
set -g focus-events on
set -s escape-time 0

# ---------- Key bindings ----------
# Prefix: Ctrl-a (easier to reach than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Intuitive splits that open in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift+arrow
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick reload
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ---------- Status bar ----------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour248"
set -g status-left "#[fg=colour232,bg=colour114,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=colour248]%H:%M  %d-%b-%y "
set -g status-right-length 40

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour232,bg=colour114,bold] #I:#W #[default]"

# ---------- Panes ----------
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour114"

# ---------- Copy mode (vi) ----------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
